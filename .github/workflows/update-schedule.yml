name: Обновление расписания метро

on:
  schedule:
    # Основной источник почасовых запусков (06:00–21:00 по Алматы) теперь —
    # внешний планировщик cron-job.org, дёргающий workflow_dispatch (см.
    # CLAUDE.md, "Надёжность автообновления расписания") — он и обеспечивает
    # реальную частоту обновлений в течение дня.
    #
    # Этот schedule: — просто бесплатный запасной вариант на случай, если
    # cron-job.org или его токен подведут, а не основной механизм: встроенный
    # cron GitHub Actions — best-effort, часть запусков молча не срабатывает
    # (проверено по факту: из ~15 ожидаемых часовых запусков в сутки реально
    # доходило 1-2). Поэтому тут достаточно двух раз в день, а не каждый час —
    # 09:13 и 18:13 по Алматы (04:13 и 13:13 UTC), минута не круглая по той же
    # причине (см. историю коммитов).
    - cron: "13 4,13 * * *"
  workflow_dispatch: {}   # позволяет запустить вручную из вкладки Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Скачать актуальное расписание с metroalmaty.kz
        run: python3 scripts/update_schedule.py

      - name: Закоммитить изменения (если есть)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json data/schedule_drift_log.jsonl
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не нужен"
            exit 0
          fi
          git commit -m "chore: автообновление расписания метро"
          git push
