name: Обновление расписания метро

on:
  schedule:
    # каждый понедельник в 02:00 по Алматы (UTC+5) = 21:00 UTC в воскресенье
    - cron: "0 21 * * 0"
  workflow_dispatch: {}   # позволяет запустить вручную из вкладки Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Скачать актуальное расписание с metroalmaty.kz
        run: python3 scripts/update_schedule.py

      - name: Закоммитить изменения (если есть)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/schedule.json; then
            echo "Расписание не изменилось — коммит не нужен"
            exit 0
          fi
          git add data/schedule.json
          git commit -m "chore: еженедельное обновление расписания метро"
          git push
