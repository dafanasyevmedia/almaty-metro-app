name: Обновление расписания метро

on:
  schedule:
    # Каждый час с 06:00 до 21:00 по Алматы (UTC+5, т.е. часы 1–16 по UTC).
    # После 21:00 не имеет смысла: скоро закрытие, а следующее открытие в 06:00 и
    # так подхватит актуальные данные. Скрипт лёгкий (11 запросов к API метро) —
    # такая частота не проблема сама по себе, но и не стоит её увеличивать дальше:
    # metroalmaty.kz — недокументированный API, дёргать его слишком часто
    # невежливо по отношению к чужому серверу. Причина именно почасового, а не
    # разового обновления: сам metroalmaty.kz, похоже, пересчитывает расписание
    # на ещё не наступившие часы дня в течение суток (проверено вручную —
    # вечернее расписание, снятое днём, через несколько часов уже отличалось на
    # живом сайте), поэтому чем чаще сверяемся, тем меньше окно расхождения.
    - cron: "0 1-16 * * *"
  workflow_dispatch: {}   # позволяет запустить вручную из вкладки Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Скачать актуальное расписание с metroalmaty.kz
        run: python3 scripts/update_schedule.py

      - name: Закоммитить изменения (если есть)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json data/schedule_drift_log.jsonl
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не нужен"
            exit 0
          fi
          git commit -m "chore: автообновление расписания метро"
          git push
