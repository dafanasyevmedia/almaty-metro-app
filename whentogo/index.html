<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Успеть к — Метро Алматы (прототип)</title>
<meta name="robots" content="noindex, nofollow" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Те же токены/шрифты, что и в основном index.html — скопировано намеренно,
     это отдельный черновой прототип (см. CLAUDE.md "Успеть к" — прототип не
     подключён к основной странице и не использует общий JS, пока фича не
     утверждена и не решено, куда её встраивать). */
  @font-face{
    font-family:"Unbounded"; font-style:normal; font-weight:500 700; font-display:swap;
    src:url("../fonts/unbounded-latin.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:"Unbounded"; font-style:normal; font-weight:500 700; font-display:swap;
    src:url("../fonts/unbounded-cyrillic.woff2") format("woff2");
    unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
  }
  @font-face{
    font-family:"Inter"; font-style:normal; font-weight:400 700; font-display:swap;
    src:url("../fonts/inter-latin.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:"Inter"; font-style:normal; font-weight:400 700; font-display:swap;
    src:url("../fonts/inter-cyrillic.woff2") format("woff2");
    unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
  }
  @font-face{
    font-family:"Inter"; font-style:normal; font-weight:400 700; font-display:swap;
    src:url("../fonts/inter-cyrillic-ext.woff2") format("woff2");
    unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F;
  }
  :root{
    --bg:oklch(0.16 0.012 255); --card:oklch(0.20 0.014 255); --card2:oklch(0.24 0.016 255);
    --text:oklch(0.95 0.006 255); --muted:oklch(0.62 0.02 255); --muted2:oklch(0.5 0.015 255);
    --border:oklch(0.30 0.02 255 / .55);
    --accent:oklch(0.82 0.19 132); --accent-ink:oklch(0.16 0.012 255); --accent-soft:oklch(0.82 0.19 132 / .14);
    --success:var(--accent); --danger:oklch(0.72 0.17 25); --warn:oklch(0.78 0.17 75);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:oklch(0.98 0.004 255); --card:oklch(0.995 0.002 255); --card2:oklch(0.93 0.008 255);
      --text:oklch(0.18 0.012 255); --muted:oklch(0.46 0.02 255); --muted2:oklch(0.6 0.015 255);
      --border:oklch(0.84 0.012 255 / .9);
      --accent:oklch(0.55 0.16 132); --accent-ink:oklch(0.99 0.003 255); --accent-soft:oklch(0.55 0.16 132 / .12);
      --danger:oklch(0.55 0.17 25); --warn:oklch(0.55 0.16 75);
    }
  }

  *{box-sizing:border-box;}
  html{ -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; color:var(--text); min-height:100vh; background:var(--bg);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:40px;
  }
  .brand,.result-countdown{ font-family:"Unbounded","Inter",sans-serif; }

  header{ position:relative; padding:22px 16px 4px; display:flex; align-items:center; gap:10px; max-width:640px; margin:0 auto; }
  .back-link{
    display:flex; align-items:center; justify-content:center; width:32px; height:32px; flex:none;
    border-radius:10px; background:var(--card2); color:var(--text); text-decoration:none; font-size:16px;
  }
  header h1{ font-size:16px; margin:0; font-weight:600; letter-spacing:-.2px; color:var(--text); }

  main{ padding:16px 16px 8px; max-width:640px; margin:0 auto; }
  .card{ background:var(--card); border-radius:18px; padding:18px; margin-bottom:12px; }
  .proto-badge{
    display:inline-block; font-size:11px; font-weight:700; color:var(--warn); background:var(--card2);
    border-radius:8px; padding:4px 9px; margin-bottom:14px;
  }

  .field{ margin-bottom:14px; }
  .field:last-of-type{ margin-bottom:0; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:6px; }

  select, input[type="time"]{
    width:100%; padding:12px 14px; border-radius:13px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:15px; font-weight:600; font-family:inherit;
    appearance:none; -webkit-appearance:none;
  }
  select{
    padding-right:36px;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%238a94ab" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
    background-repeat:no-repeat; background-position:right 12px center;
  }

  .btn{
    appearance:none; border:1px solid var(--border); background:var(--accent-soft);
    color:var(--accent); font-weight:700; font-size:13px; padding:9px 13px; font-family:inherit;
    border-radius:11px; cursor:pointer; white-space:nowrap; transition:transform .15s, opacity .15s;
  }
  .btn:active{ transform:scale(.96); opacity:.85; }
  .btn.primary{
    background:var(--accent); color:var(--accent-ink); border-color:transparent;
    width:100%; padding:12px 16px; font-size:14px; margin-top:4px;
  }

  /* Геолокация — тот же блок/классы/маскот, что и на главной странице
     (locate-block/.locate-mascot/.locate-row), скопировано намеренно один в
     один ради одинакового поведения и внешнего вида. */
  .locate-block{ display:flex; align-items:center; gap:14px; }
  .locate-content{ flex:1; min-width:0; }
  .locate-mascot{ width:56px; height:56px; flex:none; display:none; object-fit:contain; }
  .locate-mascot.show{ display:block; }
  .locate-row{ display:flex; align-items:center; gap:10px; }
  .locate-row .dot{ width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none; }
  .locate-row .dot.ok{ background:var(--success); }
  .locate-row .dot.err{ background:var(--danger); }
  .locate-row .dot.far{ background:var(--warn); }
  .locate-text{ flex:1; font-size:13.5px; color:var(--muted); line-height:1.4; }
  .locate-text b{ color:var(--text); font-weight:700; }
  .spinner{ width:16px;height:16px;border-radius:50%;border:2.5px solid var(--border); border-top-color:var(--accent); animation:spin .8s linear infinite; flex:none; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  #originSelect{ margin-top:10px; }

  .result{ display:none; }
  .result.show{ display:block; }
  .result.ok{ border:1px solid var(--success); }
  .result.fail{ border:1px solid var(--danger); }
  .result-dir{ font-size:13px; color:var(--muted); font-weight:600; margin-bottom:10px; }
  .result-dir b, .result-sub b, .result-countdown-label b{ color:var(--text); font-weight:700; }
  .result-countdown-label{ font-size:11.5px; color:var(--muted2); font-weight:600; margin-bottom:2px; }
  .result-countdown{ font-size:40px; font-weight:600; letter-spacing:-.5px; color:var(--text); font-variant-numeric:tabular-nums; }
  .result.fail .result-countdown{ color:var(--danger); font-size:22px; }
  .result-sub{ font-size:13px; color:var(--muted); margin-top:10px; line-height:1.5; }

  .route-toggle{
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%; margin-top:14px;
    padding:8px; border:none; border-top:1px solid var(--border); background:none; color:var(--muted);
    font-size:12.5px; font-weight:600; font-family:inherit; cursor:pointer;
  }
  .route-toggle .chevron{ display:inline-block; font-size:10px; transition:transform .2s; }
  .route-toggle.open .chevron{ transform:rotate(180deg); }
  .route-list{ display:none; padding-top:4px; }
  .route-list.show{ display:block; }
  .route-row{ display:flex; justify-content:space-between; gap:10px; padding:6px 2px; font-size:13px; color:var(--muted); }
  .route-row.endpoint{ color:var(--text); font-weight:700; }
  .route-row .route-time{ font-variant-numeric:tabular-nums; flex:none; }

  .note{ font-size:12.5px; color:var(--muted2); line-height:1.5; margin-top:14px; }
</style>
</head>
<body>

<header>
  <a class="back-link" href="../">←</a>
  <div class="brand"><h1>Успеть к</h1></div>
</header>

<main>
  <div class="card">
    <span class="proto-badge">Прототип — черновая версия</span>

    <div class="field">
      <label>От станции</label>
      <div class="locate-block">
        <img class="locate-mascot" id="locateMascot" src="../mascot/idle.png" alt="" />
        <div class="locate-content">
          <div class="locate-row" id="locateRow">
            <div class="spinner" id="locateSpinner"></div>
            <div class="dot" id="locateDot" style="display:none"></div>
            <div class="locate-text" id="locateText">Определяем ваше местоположение…</div>
            <button class="btn" id="locateBtn" style="display:none">Станция вручную</button>
          </div>
          <select id="originSelect" style="display:none"></select>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="destSelect">До станции</label>
      <select id="destSelect"></select>
    </div>

    <div class="field">
      <label for="targetTime">К какому времени</label>
      <input type="time" id="targetTime" />
    </div>

    <button class="btn primary" id="calcBtn">Посчитать</button>
  </div>

  <div class="card result" id="resultCard">
    <div class="result-dir" id="resultDir"></div>
    <div class="result-countdown-label" id="resultCountdownLabel" style="display:none"></div>
    <div class="result-countdown" id="resultCountdown"></div>
    <div class="result-sub" id="resultSub"></div>
    <button class="route-toggle" id="routeToggle" style="display:none">
      <span id="routeToggleText">Показать все станции</span><span class="chevron">▾</span>
    </button>
    <div class="route-list" id="routeList"></div>
  </div>

  <p class="note" id="loadNote">Загружаем расписание…</p>
</main>

<script>
(function () {
  "use strict";

  /* ---------- Telegram Mini App bootstrap — как на главной ---------- */
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

  /* ---------- Время Алматы (UTC+5) — скопировано из index.html ---------- */
  var ALMATY_OFFSET_MS = 5 * 3600 * 1000;
  function almatyNow() {
    // ВРЕМЕННО, только для ручной проверки ночного сценария — ?debugNow=00:45
    // в адресе подменяет "текущее время". Убрать перед тем, как эта страница
    // станет чем-то большим, чем черновой прототип.
    var debugNow = new URLSearchParams(location.search).get('debugNow');
    if (debugNow) {
      var p = debugNow.split(':');
      var base = new Date(Date.now() + ALMATY_OFFSET_MS);
      base.setUTCHours(+p[0], +p[1], 0, 0);
      return base;
    }
    return new Date(Date.now() + ALMATY_OFFSET_MS);
  }
  function serviceDayStart(almatyDate) {
    var d = new Date(Date.UTC(almatyDate.getUTCFullYear(), almatyDate.getUTCMonth(), almatyDate.getUTCDate()));
    if (almatyDate.getUTCHours() < 3) d.setUTCDate(d.getUTCDate() - 1);
    return d;
  }
  var HOLIDAYS = [];
  var WORKING_WEEKENDS = [];
  function dateKey(d) {
    var y = d.getUTCFullYear();
    var m = String(d.getUTCMonth() + 1).padStart(2, '0');
    var day = String(d.getUTCDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function isHolidayDate(d) { return HOLIDAYS.indexOf(dateKey(d)) !== -1; }
  function isWorkingWeekendDate(d) { return WORKING_WEEKENDS.indexOf(dateKey(d)) !== -1; }
  function dayTypeOf(midnightDate) {
    if (isWorkingWeekendDate(midnightDate)) return 'weekday';
    var wd = midnightDate.getUTCDay();
    if (wd === 0 || wd === 6) return 'weekend';
    if (isHolidayDate(midnightDate)) return 'weekend';
    return 'weekday';
  }
  function fmtHHMM(date) {
    var h = String(date.getUTCHours()).padStart(2, '0');
    var m = String(date.getUTCMinutes()).padStart(2, '0');
    return h + ':' + m;
  }
  function fmtCountdown(minutesFromNow) {
    var totalSec = Math.max(0, Math.round(minutesFromNow * 60));
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    return m + ':' + String(s).padStart(2, '0');
  }

  /* ---------- Геометрия — скопировано из index.html ---------- */
  function haversine(lat1, lon1, lat2, lon2) {
    var R = 6371000, toRad = function (d) { return d * Math.PI / 180; };
    var dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
    var a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function nearestStation(lat, lon, stations) {
    var best = null, bestDist = Infinity;
    stations.forEach(function (s) {
      var d = haversine(lat, lon, s.lat, s.lon);
      if (d < bestDist) { bestDist = d; best = s; }
    });
    return { station: best, distance: bestDist };
  }

  var STATIONS = [];
  var SCHEDULE = null;
  var STATIONS_BY_SLUG = {};

  function timeStrToMinutes(t) {
    var p = t.split(':');
    var h = +p[0], m = +p[1], s = +p[2] || 0;
    var mins = h * 60 + m + s / 60;
    if (h < 3) mins += 24 * 60;
    return mins;
  }

  function buildTimeline(slug, direction, serviceStart) {
    var st = SCHEDULE.stations[slug];
    if (!st) return [];
    var todayType = dayTypeOf(serviceStart);
    var tomorrowStart = new Date(serviceStart.getTime() + 24 * 3600 * 1000);
    var tomorrowType = dayTypeOf(tomorrowStart);
    var todayArr = (st[todayType] && st[todayType][direction]) || [];
    var tomorrowArr = (st[tomorrowType] && st[tomorrowType][direction]) || [];
    var timeline = [];
    todayArr.forEach(function (t) { timeline.push({ minutes: timeStrToMinutes(t), raw: t }); });
    tomorrowArr.forEach(function (t) { timeline.push({ minutes: timeStrToMinutes(t) + 24 * 60, raw: t }); });
    timeline.sort(function (a, b) { return a.minutes - b.minutes; });
    return timeline;
  }

  function firstTimelineIndexAfter(timeline, minutes) {
    var lo = 0, hi = timeline.length;
    while (lo < hi) {
      var mid = (lo + hi) >> 1;
      if (timeline[mid].minutes > minutes) hi = mid; else lo = mid + 1;
    }
    return lo;
  }

  var MAX_SEGMENT_MIN = 8;

  function medianSegmentTravelMin(depTimeline, arrTimeline) {
    if (!depTimeline.length || !arrTimeline.length) return null;
    var samples = [];
    for (var idx = 0; idx < depTimeline.length; idx++) {
      var dep = depTimeline[idx].minutes;
      var m = firstTimelineIndexAfter(arrTimeline, dep);
      if (m < arrTimeline.length) {
        var travel = arrTimeline[m].minutes - dep;
        if (travel > 0 && travel <= MAX_SEGMENT_MIN) samples.push(travel);
      }
    }
    if (!samples.length) return null;
    samples.sort(function (a, b) { return a - b; });
    return samples[Math.floor(samples.length / 2)];
  }

  // Ищет ночной перерыв (закрытие метро) в уже собранном таймлайне одной
  // станции — самый большой промежуток между соседними отправлениями.
  // Обычные интервалы даже в затишье — единицы минут; ночной перерыв — часы,
  // так что порог 90 минут отличает его надёжно, без привязки к конкретным
  // часам (не хардкодим "закрывается в районе полуночи" — просто смотрим,
  // где в самих данных настоящий разрыв).
  var CLOSED_GAP_THRESHOLD_MIN = 90;
  function findClosedWindow(timeline) {
    for (var i = 0; i < timeline.length - 1; i++) {
      var gap = timeline[i + 1].minutes - timeline[i].minutes;
      if (gap > CLOSED_GAP_THRESHOLD_MIN) {
        return { closing: timeline[i].minutes, opening: timeline[i + 1].minutes };
      }
    }
    return null;
  }

  // Сопоставляет тот же физический поезд между соседними станциями — первое
  // отправление nextSlug после depTime (тот же приём, что и на главной для
  // анимации точки на линии). Возвращает ещё estimated:true, если пришлось
  // оценивать через medianSegmentTravelMin (конечная станция), а не взяли
  // точное время из расписания.
  function matchNextArrival(depTime, curSlug, nextSlug, direction, serviceStart) {
    var nextTimeline = buildTimeline(nextSlug, direction, serviceStart);
    if (nextTimeline.length) {
      var m = firstTimelineIndexAfter(nextTimeline, depTime);
      if (m < nextTimeline.length && nextTimeline[m].minutes - depTime <= MAX_SEGMENT_MIN) {
        return { minutes: nextTimeline[m].minutes, estimated: false };
      }
      return null;
    }
    var oppDir = direction === 'forward' ? 'backward' : 'forward';
    var est = medianSegmentTravelMin(
      buildTimeline(nextSlug, oppDir, serviceStart),
      buildTimeline(curSlug, oppDir, serviceStart)
    );
    return est != null ? { minutes: depTime + est, estimated: true } : null;
  }

  // Цепочкой матчим через все промежуточные станции от origin до dest.
  // path — время на КАЖДОЙ станции по пути (включая origin/dest) — для
  // разворачивающегося списка станций под результатом.
  function estimateArrival(originIdx, destIdx, direction, departureMinutes, serviceStart) {
    var step = direction === 'forward' ? 1 : -1;
    var i = originIdx, t = departureMinutes, estimated = false;
    var path = [{ idx: i, minutes: t }];
    while (i !== destIdx) {
      var curSlug = STATIONS[i].slug;
      var nextIdx = i + step;
      var nextSlug = STATIONS[nextIdx].slug;
      var res = matchNextArrival(t, curSlug, nextSlug, direction, serviceStart);
      if (res == null) return null;
      t = res.minutes;
      if (res.estimated) estimated = true;
      i = nextIdx;
      path.push({ idx: i, minutes: t });
    }
    return { minutes: t, estimated: estimated, path: path };
  }

  /* ---------- Геолокация — тот же поток, что и на главной странице ---------- */
  var locateMascot = document.getElementById('locateMascot');
  var locateSpinner = document.getElementById('locateSpinner');
  var locateDot = document.getElementById('locateDot');
  var locateText = document.getElementById('locateText');
  var locateBtn = document.getElementById('locateBtn');
  var originSelect = document.getElementById('originSelect');
  var FAR_FROM_ALMATY_METERS = 30000;
  var originSlug = null;

  function setLocateStatusDOM(kind, html) {
    locateSpinner.style.display = kind === 'loading' ? '' : 'none';
    locateDot.style.display = kind === 'loading' ? 'none' : '';
    locateDot.className = 'dot' + (kind === 'ok' ? ' ok' : kind === 'err' ? ' err' : kind === 'far' ? ' far' : '');
    locateText.innerHTML = html;
    if (kind === 'loading') {
      locateMascot.src = '../mascot/idle.png';
      locateMascot.classList.add('show');
    } else if (kind === 'err') {
      locateMascot.src = '../mascot/searching.png';
      locateMascot.classList.add('show');
    } else if (kind === 'far') {
      locateMascot.src = '../mascot/far.png';
      locateMascot.classList.add('show');
    } else {
      locateMascot.classList.remove('show');
    }
  }

  function setOrigin(slug) {
    originSlug = slug;
    originSelect.value = slug;
  }

  function onGeoSuccess(lat, lon) {
    var res = nearestStation(lat, lon, STATIONS);
    if (res.distance > FAR_FROM_ALMATY_METERS) {
      setLocateStatusDOM('far', 'Кажется, вы не в Алматы… Ближайшая станция отсюда — «' + res.station.name.ru + '», это ' + Math.round(res.distance / 1000) + ' км. Можно выбрать станцию вручную.');
      locateBtn.style.display = 'none';
      originSelect.style.display = '';
      setOrigin(STATIONS[0].slug);
      return;
    }
    setLocateStatusDOM('ok', 'Ближайшая станция: <b>' + res.station.name.ru + '</b> (≈' + Math.round(res.distance) + ' м)');
    locateBtn.style.display = '';
    setOrigin(res.station.slug);
  }

  function onGeoFail(reasonKey) {
    var reason = reasonKey === 'permissionDenied' ? 'нет разрешения' : reasonKey === 'unsupported' ? 'геолокация не поддерживается браузером' : null;
    setLocateStatusDOM('err', 'Не удалось определить местоположение' + (reason ? ' (' + reason + ')' : '') + '. Выберите станцию вручную.');
    locateBtn.style.display = 'none';
    originSelect.style.display = '';
    setOrigin(STATIONS[0].slug);
  }

  function tryTelegramLocation() {
    if (tg && tg.LocationManager && typeof tg.LocationManager.init === 'function') {
      var settled = false;
      var fallbackTimer = setTimeout(function () {
        if (!settled) { settled = true; tryBrowserGeolocation(); }
      }, 2500);
      try {
        tg.LocationManager.init(function () {
          if (settled) return;
          if (!tg.LocationManager.isLocationAvailable) {
            settled = true; clearTimeout(fallbackTimer); tryBrowserGeolocation(); return;
          }
          tg.LocationManager.getLocation(function (data) {
            if (settled) return;
            settled = true; clearTimeout(fallbackTimer);
            if (data && typeof data.latitude === 'number') {
              onGeoSuccess(data.latitude, data.longitude);
            } else {
              tryBrowserGeolocation();
            }
          });
        });
        return true;
      } catch (e) {
        clearTimeout(fallbackTimer);
        return false;
      }
    }
    return false;
  }

  function tryBrowserGeolocation() {
    if (!navigator.geolocation) { onGeoFail('unsupported'); return; }
    navigator.geolocation.getCurrentPosition(
      function (pos) { onGeoSuccess(pos.coords.latitude, pos.coords.longitude); },
      function (err) { onGeoFail(err && err.code === 1 ? 'permissionDenied' : null); },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
    );
  }

  locateBtn.addEventListener('click', function () {
    originSelect.style.display = originSelect.style.display === 'none' ? '' : 'none';
  });
  originSelect.addEventListener('change', function () {
    originSlug = originSelect.value;
  });

  /* ---------- UI формы/результата ---------- */
  var destSelect = document.getElementById('destSelect');
  var targetTimeInput = document.getElementById('targetTime');
  var calcBtn = document.getElementById('calcBtn');
  var resultCard = document.getElementById('resultCard');
  var resultDir = document.getElementById('resultDir');
  var resultCountdownLabel = document.getElementById('resultCountdownLabel');
  var resultCountdown = document.getElementById('resultCountdown');
  var resultSub = document.getElementById('resultSub');
  var routeToggle = document.getElementById('routeToggle');
  var routeToggleText = document.getElementById('routeToggleText');
  var routeList = document.getElementById('routeList');
  var loadNote = document.getElementById('loadNote');
  var countdownTimer = null;

  // Список станций маршрута под результатом — свёрнут по умолчанию, при
  // каждом новом расчёте снова сворачивается (не тащим раскрытое состояние
  // на новый, не связанный результат).
  function renderRoute(path, serviceStart) {
    if (!path || !path.length) {
      routeToggle.style.display = 'none';
      routeList.classList.remove('show');
      return;
    }
    routeList.innerHTML = '';
    path.forEach(function (step, idx) {
      var name = STATIONS[step.idx].name.ru;
      var clock = fmtHHMM(new Date(serviceStart.getTime() + step.minutes * 60000));
      var row = document.createElement('div');
      row.className = 'route-row' + (idx === 0 || idx === path.length - 1 ? ' endpoint' : '');
      row.innerHTML = '<span>' + name + '</span><span class="route-time">' + clock + '</span>';
      routeList.appendChild(row);
    });
    routeToggle.style.display = '';
    routeToggle.classList.remove('open');
    routeToggleText.textContent = 'Показать все станции';
    routeList.classList.remove('show');
  }
  routeToggle.addEventListener('click', function () {
    var open = routeList.classList.toggle('show');
    routeToggle.classList.toggle('open', open);
    routeToggleText.textContent = open ? 'Скрыть станции' : 'Показать все станции';
  });

  function populateSelects() {
    STATIONS.forEach(function (s) {
      var o1 = document.createElement('option'); o1.value = s.slug; o1.textContent = s.name.ru;
      originSelect.appendChild(o1);
      var o2 = document.createElement('option'); o2.value = s.slug; o2.textContent = s.name.ru;
      destSelect.appendChild(o2);
    });
    destSelect.value = STATIONS[STATIONS.length - 1].slug;
    var now = almatyNow();
    var plus30 = new Date(now.getTime() + 30 * 60000);
    targetTimeInput.value = String(plus30.getUTCHours()).padStart(2, '0') + ':' + String(plus30.getUTCMinutes()).padStart(2, '0');
  }

  function stopCountdown() {
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    resultCountdownLabel.style.display = 'none';
  }
  function startCountdown(departureAbsoluteMs, labelHTML) {
    stopCountdown();
    resultCountdownLabel.innerHTML = labelHTML;
    resultCountdownLabel.style.display = '';
    function tick() {
      var diffMin = (departureAbsoluteMs - almatyNow().getTime()) / 60000;
      resultCountdown.textContent = fmtCountdown(diffMin);
      if (diffMin <= 0) stopCountdown();
    }
    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  function calculate() {
    if (!originSlug) {
      resultCard.className = 'card result show fail';
      resultDir.textContent = '';
      resultCountdown.textContent = 'Подождите';
      resultSub.textContent = 'Ещё определяем станцию отправления — попробуйте ещё раз через секунду, или выберите станцию вручную.';
      stopCountdown();
      renderRoute(null);
      return;
    }
    var destSlug = destSelect.value;
    if (originSlug === destSlug) {
      resultCard.className = 'card result show fail';
      resultDir.textContent = '';
      resultCountdown.textContent = 'Ошибка';
      resultSub.textContent = 'Станция отправления и назначения совпадают.';
      stopCountdown();
      renderRoute(null);
      return;
    }
    var originIdx = STATIONS.findIndex(function (s) { return s.slug === originSlug; });
    var destIdx = STATIONS.findIndex(function (s) { return s.slug === destSlug; });
    var direction = destIdx > originIdx ? 'forward' : 'backward';
    var toBM = STATIONS_BY_SLUG['BM'];
    var toRMBK = STATIONS_BY_SLUG['RMBK'];
    // Название конечной станции линии, без стрелки — стрелка рядом с уже
    // написанным ниже названием реальной станции назначения читалась криво
    // (два разных названия станций рядом, зрительный шум).
    var dirLabel = direction === 'forward' ? ('в сторону <b>' + toBM.name.ru + '</b>') : ('в сторону <b>' + toRMBK.name.ru + '</b>');

    var now = almatyNow();
    var serviceStart = serviceDayStart(now);
    var nowMinutes = (now - serviceStart) / 60000;

    var targetStr = targetTimeInput.value;
    if (!targetStr) {
      resultCard.className = 'card result show fail';
      resultDir.textContent = '';
      resultCountdown.textContent = 'Ошибка';
      resultSub.textContent = 'Укажите время.';
      stopCountdown();
      renderRoute(null);
      return;
    }
    // Целевое время из <input type="time"> — это выбор пользователя, а не
    // сырая строка расписания, семантика другая: обычную "хвост суток"
    // поправку (часы 0-2) держим для согласованности с остальной шкалой
    // минут, но добавляем ещё один слой поверх — если после этого целевое
    // время ВСЁ РАВНО в прошлом, но НЕДАВНО (< 1 часа) — считаем, что имелся
    // в виду сегодняшний, уже упущенный момент ("не успеваете" — честно).
    // Если в прошлом больше часа — скорее всего, имелось в виду ближайшее
    // будущее наступление этого времени, то есть завтра (как в большинстве
    // планировщиков: никто не ставит заведомо прошедший дедлайн специально).
    var targetMinutes = timeStrToMinutes(targetStr);
    if (nowMinutes - targetMinutes > 60) targetMinutes += 24 * 60;

    var originTimeline = buildTimeline(originSlug, direction, serviceStart);

    // Решающая проверка, и идёт ПЕРВОЙ, ещё до поиска поезда: если само
    // целевое время попадает в ночной перерыв — сразу "метро не работает,
    // такси", независимо от того, что сейчас за час и нашёлся бы формально
    // подходящий более ранний поезд или нет. Так честнее: если человек
    // спрашивает "успею ли к 3 ночи", ответ "да, если сесть на вечерний
    // поезд несколькими часами раньше" не отвечает на то, что он спросил.
    var closedWindow = findClosedWindow(originTimeline);
    if (closedWindow && targetMinutes >= closedWindow.closing + 30 && targetMinutes <= closedWindow.opening - 30) {
      var closingClock = fmtHHMM(new Date(serviceStart.getTime() + closedWindow.closing * 60000));
      var openingClock = fmtHHMM(new Date(serviceStart.getTime() + closedWindow.opening * 60000));
      resultCard.className = 'card result show fail';
      resultDir.textContent = 'В это время метро не работает';
      resultSub.innerHTML = 'Метро закрыто примерно с ' + closingClock + ' до ' + openingClock + ' — лучше поехать на такси.';
      resultCountdown.textContent = '🚕';
      stopCountdown();
      renderRoute(null);
      return;
    }

    var upcoming = originTimeline.filter(function (e) { return e.minutes >= nowMinutes - 0.001; });

    var best = null;
    var firstEstimate = null;
    for (var k = 0; k < upcoming.length; k++) {
      var dep = upcoming[k];
      var arr = estimateArrival(originIdx, destIdx, direction, dep.minutes, serviceStart);
      if (arr == null) continue;
      if (firstEstimate == null) firstEstimate = { departure: dep, arrival: arr };
      // Сравниваем по отображаемой минуте (Math.floor), а не по точным секундам —
      // в расписании прибытие может быть, например, "22:50:20", округляется до
      // "22:50" на экране. Целевое время из <input type="time"> всегда без
      // секунд, ровно на границе минуты. Без floor поезд, что и на экране, и на
      // слух приходит "в 22:50" вместе с целевым, проигрывал бы на секунды.
      if (Math.floor(arr.minutes) <= targetMinutes) {
        best = { departure: dep, arrival: arr };
      } else {
        break;
      }
    }

    var destName = STATIONS[destIdx].name.ru;

    if (best) {
      var depAbsoluteMs = serviceStart.getTime() + best.departure.minutes * 60000;
      var arrClock = fmtHHMM(new Date(serviceStart.getTime() + best.arrival.minutes * 60000));
      var depClock = fmtHHMM(new Date(depAbsoluteMs));
      resultCard.className = 'card result show ok';
      resultDir.innerHTML = 'Садитесь на поезд в ' + depClock + ' ' + dirLabel;
      resultSub.innerHTML = (best.arrival.estimated ? 'Ориентировочно поезд' : 'Поезд') +
        ' будет на станции «<b>' + destName + '</b>» в ' + arrClock;
      startCountdown(depAbsoluteMs, 'Отправляется через');
      renderRoute(best.arrival.path, serviceStart);
    } else if (firstEstimate) {
      var arrClock2 = fmtHHMM(new Date(serviceStart.getTime() + firstEstimate.arrival.minutes * 60000));
      var depAbsoluteMs2 = serviceStart.getTime() + firstEstimate.departure.minutes * 60000;
      resultCard.className = 'card result show fail';
      resultDir.innerHTML = 'Не успеваете к ' + targetStr + ' быть на «<b>' + destName + '</b>»';
      resultSub.innerHTML = 'Поезд будет на станции «<b>' + destName + '</b>» в ' + arrClock2;
      startCountdown(depAbsoluteMs2, 'Ближайший поезд ' + dirLabel + ' отправляется через');
      renderRoute(firstEstimate.arrival.path, serviceStart);
    } else {
      resultCard.className = 'card result show fail';
      resultDir.textContent = '';
      resultCountdown.textContent = '—';
      resultSub.textContent = 'Не нашлось подходящих рейсов в расписании на сегодня.';
      stopCountdown();
      renderRoute(null);
    }
  }

  calcBtn.addEventListener('click', calculate);

  Promise.all([
    fetch('../data/stations.json').then(function (r) { return r.json(); }),
    fetch('../data/schedule.json').then(function (r) { return r.json(); }),
    fetch('../data/holidays.json').then(function (r) { return r.json(); }).catch(function () { return { dates: [], workingWeekends: [] }; })
  ]).then(function (results) {
    STATIONS = results[0].slice().sort(function (a, b) { return a.order - b.order; });
    SCHEDULE = results[1];
    HOLIDAYS = (results[2] && results[2].dates) || [];
    WORKING_WEEKENDS = (results[2] && results[2].workingWeekends) || [];
    STATIONS.forEach(function (s) { STATIONS_BY_SLUG[s.slug] = s; });
    populateSelects();
    loadNote.style.display = 'none';
    if (!tryTelegramLocation()) tryBrowserGeolocation();
  }).catch(function (err) {
    loadNote.textContent = 'Не удалось загрузить расписание: ' + err.message;
  });
})();
</script>
</body>
</html>
