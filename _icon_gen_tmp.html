<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<div id="out"></div>
<script>
var SVG_MARKUP = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' +
  '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
  '<stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#3b82f6"/>' +
  '</linearGradient></defs>' +
  '<rect x="4" y="3" width="16" height="13" rx="5" fill="url(#g)"/>' +
  '<rect x="7" y="6" width="4.2" height="4.2" rx="1.1" fill="#fff" fill-opacity=".92"/>' +
  '<rect x="12.8" y="6" width="4.2" height="4.2" rx="1.1" fill="#fff" fill-opacity=".92"/>' +
  '<circle cx="8" cy="19.5" r="1.6" fill="url(#g)"/>' +
  '<circle cx="16" cy="19.5" r="1.6" fill="url(#g)"/>' +
  '<path d="M5 16.5L3.3 20M19 16.5l1.7 3.5" stroke="url(#g)" stroke-width="1.4" stroke-linecap="round"/>' +
  '</svg>';

var svgBlob = new Blob([SVG_MARKUP], {type: 'image/svg+xml'});
var svgUrl = URL.createObjectURL(svgBlob);
var img = new Image();

var SIZES = [16, 32, 180, 192, 512];
var PADDING_RATIO = 0.16; // отступ от края квадрата до иконки

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

img.onload = function(){
  var results = {};
  var done = 0;
  SIZES.forEach(function(size){
    var canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext('2d');
    // белый фон со скруглением (на iOS/Android всё равно замаскируют под свою форму,
    // но так иконка нормально выглядит и как фавикон вкладки браузера)
    var r = size * 0.22;
    roundRect(ctx, 0, 0, size, size, r);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    var pad = size * PADDING_RATIO;
    var inner = size - pad * 2;
    ctx.drawImage(img, pad, pad, inner, inner);
    results[size] = canvas.toDataURL('image/png');
    done++;
    if (done === SIZES.length){
      window.__ICON_RESULTS__ = results;
      document.getElementById('out').textContent = 'READY:' + Object.keys(results).join(',');
    }
  });
};
img.onerror = function(e){ document.getElementById('out').textContent = 'ERROR loading svg'; };
img.src = svgUrl;
</script>
</body>
</html>
